# ============================================================
# Nginx Configuration: Frontend SPA
# ============================================================
# File: /etc/nginx/sites-available/clientes.bitlogic.com.ar
#
# Setup:
#   sudo cp nginx/clientes.bitlogic.com.ar.conf \
#       /etc/nginx/sites-available/clientes.bitlogic.com.ar
#   sudo ln -s /etc/nginx/sites-available/clientes.bitlogic.com.ar \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL Certificate:
#   sudo certbot certonly --nginx -d clientes.bitlogic.com.ar
# ============================================================

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clientes.bitlogic.com.ar;

    # Root directory (where `dist/` is deployed)
    root /var/www/bitlogic-client-hub/dist;
    index index.html;

    # ── SSL/TLS Configuration ─────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/clientes.bitlogic.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clientes.bitlogic.com.ar/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:;" always;

    # Remove server header
    server_tokens off;

    # ── Logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/clientes.bitlogic.com.ar.access.log;
    error_log /var/log/nginx/clientes.bitlogic.com.ar.error.log warn;

    # ── SPA Routing (all requests to index.html) ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Assets with Cache ─────────────────────────────────────────────
    # JavaScript and CSS bundles (long-lived cache)
    location ~ \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and media (long-lived cache)
    location ~ \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML files (no cache - always fetch latest)
    location ~ \.html?$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── API Proxy (if serving from same domain) ───────────────────────
    # location /api/ {
    #     proxy_pass https://api-clientes.bitlogic.com.ar/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host api-clientes.bitlogic.com.ar;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Block common attacks ──────────────────────────────────────────
    location ~ ~* (\.php$|\.asp$|\.jsp$|\.cgi$) {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Gzip Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_disable "msie6";
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clientes.bitlogic.com.ar;

    # Allow certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Deny all other domains
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    return 444;
}
