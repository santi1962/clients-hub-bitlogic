# ============================================================
# Nginx Configuration: API Backend Reverse Proxy
# ============================================================
# File: /etc/nginx/sites-available/api-clientes.bitlogic.com.ar
#
# Setup:
#   sudo cp nginx/api-clientes.bitlogic.com.ar.conf \
#       /etc/nginx/sites-available/api-clientes.bitlogic.com.ar
#   sudo ln -s /etc/nginx/sites-available/api-clientes.bitlogic.com.ar \
#       /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL Certificate:
#   sudo certbot certonly --nginx -d api-clientes.bitlogic.com.ar
# ============================================================

upstream backend_api {
    least_conn;
    server localhost:3001 weight=1 max_fails=3 fail_timeout=30s;
    # server localhost:3002 weight=1 max_fails=3 fail_timeout=30s;  # Add more if scaling
    keepalive 32;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-clientes.bitlogic.com.ar;

    # ── SSL/TLS Configuration ─────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/api-clientes.bitlogic.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-clientes.bitlogic.com.ar/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # Modern configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ── Logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/api-clientes.bitlogic.com.ar.access.log;
    error_log /var/log/nginx/api-clientes.bitlogic.com.ar.error.log warn;

    # ── Reverse Proxy to Backend ──────────────────────────────────────
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (match backend shutdown timeout)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Keep-alive
        proxy_set_header Connection "";

        # Cache control
        proxy_cache_bypass $http_pragma $http_authorization;
    }

    # ── Health Check Endpoint ─────────────────────────────────────────
    location ~ ^/(api/health|api/system/status)$ {
        proxy_pass http://backend_api;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── Block common attacks ──────────────────────────────────────────
    location ~ ~* (\.php$|\.asp$|\.jsp$|\.cgi$) {
        deny all;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Rate limiting ─────────────────────────────────────────────────
    # Define limit zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Apply to all API endpoints
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api-clientes.bitlogic.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
